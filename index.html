<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='UTF-8'>
    <meta name='description'
        content='A unit conversion tool to convert values from Metric to Imperial or Imperial to Metric'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel='stylesheet' href='reset.css'>
    <link rel='stylesheet' href='style.css'>
    <title>Unit Conversion</title>
</head>

<body>
    <div class="card">
        <header>
            <h1>Metric/Imperial Unit Conversion</h1>
            <form>
                <label for='value'>Value</label>
                <input type='number' id='value' value='1'>
            </form>
            <button class='button' id='button'>Convert</button>
        </header>
        <main>

            <div class="container">
                <h2>Length (Meter/Feet)</h2>
                <p id='length'></p>
            </div>
            <div class="container">
                <h2>Volume (Liters/Gallons)</h2>
                <p id='volume'></p>
            </div>
            <div class="container">
                <h2>Mass (Kilograms/Pounds)</h2>
                <p id='mass'></p>
            </div>

        </main>
    </div>
</body>
<script src='script.js'></script>
<script src='unit-conversion.js'></script>


</html>
